<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MyOS</title>
        <meta name="description" content="MyOS - a personalized, modular productivity environment that runs on any static host.">
        <!-- Custom CSS -->
        <link href="css/themes.css" rel="stylesheet">
        <link href="css/core.css" rel="stylesheet">
        <link href="css/menu.css" rel="stylesheet">
        <!-- Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    </head>

    <body>
    <!-- ===============================
            🔹 Header
    =============================== -->
        <header class="systembar">
            <h1 class="head-title">MyOS</h1>
            <!-- Theme toggle -->
            <div class="theme-toggle">
                <button type="button" class="theme-btn" id="theme-toggle-btn" aria-label="Toggle dark mode">
                    <span class="icon icon-sun" id="theme-icon">☀️</span>
                </button>
            </div>            
        </header>

    <!-- ===============================
            🔹 MAIN CONTENT
    =============================== -->
        <div class="homescreen">
            <div id="app-windows"></div>

            <div class="app-window" id="AppListWindow" style="display:none; top:160px; left:160px; width:340px; height:400px; z-index:110;">
                <div class="app-header">
                    <span class="app-title">All Apps</span>
                    <div class="app-controls">
                        <button class="close-btn" title="Close">×</button>
                    </div>
                </div>
                <div class="app-content" style="overflow:auto;">
                    <div id="app-list" class="app-list"></div>
                </div>
                <div class="resize-handle"></div>
            </div>
        </div>

    <!-- ===============================
            🔹 FOOTER
    =============================== -->
        <footer class="taskbar">
            <button class="menu-btn" id="menu-btn">
                <img src="assets/menu.svg" class="menu-icon" alt="menu icon">
            </button>

            <div class="start-menu" id="start-menu">
                <div class="menu-content">
                    <ul class="menu-list">
                        <li><button id="settingsButton">⚙️ Settings</button></li>
                        <li><button id="appsButton">💻 Apps</button></li>
                    </ul>
                </div>
            </div>

            <div class="center-area">
                <div class="search-bar">
                    <form id="searchForm" role="search">
                        <input type="search" id="searchInput" name="q" placeholder="🔍 Search apps" autocomplete="off">
                    </form>
                </div>
                <div class="app-bar">
                <!-- icons can go here -->
                </div>
            </div>

        <div class="right-area">
            <div class="time">
                <button id="clockButton">
                    <span id="currentTime"></span>
                    <span id="currentDate"></span>
                </button>
            </div>

            <div id="clockPopup" class="popup hidden">
                <div class="popup-content">
                    <div id="calendar" class="calendar"></div>
                </div>
            </div>
        </div>
        </footer>

        <!-- Custom JS -->
        <script src="js/theme.js"></script>         
        <script src="js/core.js"></script>   
        <script src="js/windowManager.js"></script>
        <script src="js/loader.js"></script>

    </body>
</html>
